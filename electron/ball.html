<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>谁是幸运儿</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    #ball {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: grab;
      display: grid;
      place-items: center;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow:
        0 5px 14px rgba(0, 0, 0, 0.18),
        inset 0 0 0 1px rgba(0, 0, 0, 0.03);
      /* 只留阴影过渡：原来还写了 transform 0.12s，但 CSS 与 JS 都没有任何地方
         给 #ball 设过 transform，属于纯死声明。留着它反而是个陷阱——以后真要用
         transform 做按压反馈时会莫名其妙多出 0.12s 延迟。 */
      transition: box-shadow 0.15s ease;
      touch-action: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 键盘聚焦时给个可见的焦点环 */
    #ball:focus-visible {
      outline: 2px solid #bf2f4d;
      outline-offset: 2px;
    }

    #ball:hover {
      box-shadow:
        0 7px 18px rgba(0, 0, 0, 0.22),
        inset 0 0 0 1px rgba(0, 0, 0, 0.03);
    }

    #ball:active {
      cursor: grabbing;
    }

    #ball span {
      pointer-events: none;
      color: #bf2f4d;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.02em;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div
    id="ball"
    role="button"
    tabindex="0"
    aria-label="谁是幸运儿：按回车打开主界面，按住可拖动"
    title="点击打开「谁是幸运儿」，按住可移动"
  >
    <span aria-hidden="true">幸运儿</span>
  </div>

  <script>
    (function () {
      var ball = document.getElementById('ball');
      var api = window.desktopBall;

      var DRAG_SLOP = 25; // 平方后的阈值，约 5px

      var pressed = false;
      var moved = false;
      var startX = 0;
      var startY = 0;

      // ---- 拖动位置合并 ----
      // pointermove 在高回报率鼠标上会打到 125~1000Hz，而主进程每移动一次窗口
      // 要花 0.3ms 以上（setBounds 实测 324µs）。原来每个事件都发一次 IPC，
      // 一秒就是几十到上百毫秒的主进程开销。这里合并到一帧只发最后一次，
      // 位置不丢、手感不变（实测 showInactive 的未聚焦窗口 rAF 稳定 60fps）。
      var pendingMove = null;
      var moveRaf = 0;
      var moveTimer = 0;

      function flushMove() {
        if (moveRaf) { cancelAnimationFrame(moveRaf); moveRaf = 0; }
        if (moveTimer) { clearTimeout(moveTimer); moveTimer = 0; }
        var p = pendingMove;
        pendingMove = null;
        if (p && api && api.dragMove) api.dragMove(p.x, p.y, p.type);
      }

      function sendDragStart(x, y, pointerType) {
        if (api && api.dragStart) api.dragStart(x, y, pointerType);
      }

      function sendDragMove(x, y, pointerType) {
        pendingMove = { x: x, y: y, type: pointerType };
        if (moveRaf) return;
        moveRaf = requestAnimationFrame(flushMove);
        // 兜底：万一 rAF 被节流（窗口被完全遮挡等情况），保证拖动不会卡住
        moveTimer = setTimeout(flushMove, 32);
      }

      ball.addEventListener('pointerdown', function (e) {
        // 鼠标只响应左键；触摸 / 笔尖一律放行，避免个别设备上报异常 button 值
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        pressed = true;
        moved = false;
        startX = e.screenX;
        startY = e.screenY;

        sendDragStart(e.screenX, e.screenY, e.pointerType || 'mouse');

        try {
          ball.setPointerCapture(e.pointerId);
        } catch (_err) {}

        e.preventDefault();
      });

      ball.addEventListener('pointermove', function (e) {
        if (!pressed) return;

        var dx = e.screenX - startX;
        var dy = e.screenY - startY;

        if (!moved && dx * dx + dy * dy > DRAG_SLOP) {
          moved = true;
        }
        if (!moved) return;

        sendDragMove(e.screenX, e.screenY, e.pointerType || 'mouse');
        e.preventDefault();
      });

      function endDrag(openWhenTap) {
        if (!pressed) return;
        pressed = false;

        // 先补发最后一次位置，再结束拖动，否则松手瞬间会丢掉一小段位移
        if (pendingMove) flushMove();
        if (api && api.dragEnd) api.dragEnd();

        if (openWhenTap && !moved && api && api.open) {
          api.open();
        }
        moved = false;
      }

      ball.addEventListener('pointerup', function (e) {
        endDrag(true);
        e.preventDefault();
      });

      // 触摸被系统或浏览器中断时，干净地结束拖动，且不误触打开
      ball.addEventListener('pointercancel', function () {
        endDrag(false);
      });

      // 触摸长按不弹右键菜单
      ball.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });

      // 键盘可达：悬浮球原本只有指针事件，键盘用户完全打不开主界面
      ball.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
        e.preventDefault();
        if (api && api.open) api.open();
      });
    })();
  </script>
</body>
</html>
