<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS 点名器 · 谁是幸运儿</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">★</span>
        <span class="brand-name">CS 点名器</span>
      </div>

      <div class="topbar-right">
        <button class="chip chip-btn chip-mode" id="modeChip" type="button">趣味模式</button>
        <span class="chip chip-dim" id="rosterCount">— 人</span>
        <button class="chip chip-btn" id="soundBtn" type="button">音效 开</button>
        <a class="switch-btn" href="../index.html" title="切换回抽签">⇄ 抽签</a>
        <button class="chip chip-btn ball-return-chip" id="ballReturn" type="button" title="回到悬浮球">✕ 悬浮球</button>
      </div>
    </header>

    <main class="stage">
      <div class="opener" id="opener">
        <div class="strip" aria-hidden="true">
          <div class="reel" id="stripReel"></div>
        </div>

        <div class="lens">
          <div class="lens-inner">
            <div class="reel" id="lensReel"></div>
          </div>
          <div class="pointer" aria-hidden="true"></div>
        </div>
      </div>

      <p class="status" id="status" role="status" aria-live="polite">准备就绪</p>
      <!-- 屏幕阅读器专用：状态条只播稀有度，这里补上人名 -->
      <p class="sr-only" id="srAnnounce" role="status" aria-live="polite"></p>

      <button class="open-btn" id="openBtn" type="button">
        <span id="openBtnLabel">开始点名</span>
      </button>

      <p class="hint">按空格键也可以开始</p>
    </main>

    <section class="result" id="result" hidden>
      <div class="result-card" id="resultCard">
        <span class="result-tag" id="resultTag">—</span>
        <span class="result-name" id="resultName">—</span>
      </div>
    </section>

    <section class="history">
      <div class="history-head">
        <span class="history-title">最近点名</span>
        <button class="history-clear" id="clearHistory" type="button">清空</button>
      </div>
      <ol class="history-list" id="historyList"></ol>
      <p class="history-empty" id="historyEmpty">还没有记录</p>
    </section>
  </div>

  <script src="../data/names.js"></script>
  <script src="app.js"></script>
  <script>
    // 只有桌面版（悬浮球）存在 window.desktopBall；网页版这个按钮保持隐藏
    (function () {
      if (!window.desktopBall) return;
      var btn = document.getElementById("ballReturn");
      if (!btn) return;
      btn.style.display = "inline-block";
      btn.addEventListener("click", function () {
        window.desktopBall.returnToBall();
      });
    })();
  </script>
</body>
</html>
